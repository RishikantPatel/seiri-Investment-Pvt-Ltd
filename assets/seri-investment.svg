<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Seri Investment Private Limited</title>
  <desc id="desc">Seri Investment wordmark with a rising green market arrow.</desc>
  <defs>
    <linearGradient id="green" x1="0" x2="1" y1="1" y2="0">
      <stop stop-color="#04a960"/>
      <stop offset="1" stop-color="#2fe88a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop stop-color="#0988ed"/>
      <stop offset="1" stop-color="#41b5ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M171 224 352 48" stroke="url(#green)" stroke-width="26" filter="url(#glow)"/>
    <path d="m284 48 68-1-2 68" stroke="url(#green)" stroke-width="26"/>
  </g>
  <path d="M326 236h55v-126l-55 42z" fill="#00b86b"/>
  <path d="M397 236h55V93l-55 43z" fill="#f6f7fa"/>
  <text x="55" y="300" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="178" font-weight="700" letter-spacing="-14">SEIR</text>
  <text x="604" y="300" fill="url(#blue)" font-family="Georgia, 'Times New Roman', serif" font-size="178" font-weight="700" letter-spacing="-12">I</text>
  <text x="65" y="380" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="500" letter-spacing="13">INVESTMENT</text>
  <g fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="500" letter-spacing="3">
    <path d="M67 423h100" stroke="#f8fafc" stroke-width="10"/>
    <text x="185" y="438">PRIVATE LIMITED</text>
    <path d="M591 423h100" stroke="#f8fafc" stroke-width="10"/>
  </g>
</svg>
